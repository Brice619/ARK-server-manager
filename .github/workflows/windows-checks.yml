name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ArkServerManager.slnx
      - name: Build
        run: dotnet build ArkServerManager.slnx -c Release --no-restore --verbosity minimal
      - name: Test
        run: dotnet test tests/ArkServerManager.Core.Tests/ArkServerManager.Core.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=windows.trx" --results-directory artifacts/test-results
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: artifacts/test-results
          if-no-files-found: warn

